plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.arnoutpro.ipod3g'
    compileSdk 34

    defaultConfig {
        applicationId 'com.arnoutpro.ipod3g'
        minSdk 26
        targetSdk 34
        def run = (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()
        versionCode run
        versionName "1.0.${run}"
    }

    // A fixed key that lives in the repo, so every build can be installed over the
    // previous one. Fine for a personal sideloaded app, never use it for the Play Store.
    signingConfigs {
        local {
            storeFile file('ipod3g.jks')
            storePassword 'ipod3gpass'
            keyAlias 'ipod3g'
            keyPassword 'ipod3gpass'
        }
    }

    buildTypes {
        release {
            // R8 drops unused code from the app and its libraries, mostly the Cast SDK.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.local
        }
        debug {
            signingConfig signingConfigs.local
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

kotlin {
    compilerOptions {
        // Same bytecode level as the Java code (compileOptions above).
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    // Spotify's App Remote SDK (Apache-2.0), from github.com/spotify/android-sdk/releases:
    // wakes and controls the Spotify app in the background. It reads Spotify's replies with Gson.
    implementation files('libs/spotify-app-remote-release-0.8.0.aar')
    implementation 'com.google.code.gson:gson:2.10.1'
    // Google Cast: finds Chromecasts and plays the phone's own music on them.
    implementation 'com.google.android.gms:play-services-cast-framework:22.3.1'
    // Coroutines for the Kotlin code: background work written as straight code, not callbacks.
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
}
