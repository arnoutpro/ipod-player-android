plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.arnoutpro.ipod3g'
    compileSdk 34

    defaultConfig {
        applicationId 'com.arnoutpro.ipod3g'
        minSdk 26
        targetSdk 34
        // Set by the GitHub workflow; for a local build, the number the next release will get.
        def build = (System.getenv('BUILD_NUMBER') ?: '1').toInteger()
        versionCode build
        versionName "1.0.${build}"
    }

    // The release key stays out of the repo. GitHub's build gets it from the repo's secrets
    // (SIGNING_KEYSTORE, SIGNING_PASSWORD), a local build from ~/.gradle/gradle.properties
    // (ipodKeystore, ipodKeyPassword). Without it a build is signed with Android's debug key and
    // won't install over the real app.
    def keystorePath = System.getenv('SIGNING_KEYSTORE') ?: project.findProperty('ipodKeystore')
    def signingPassword = System.getenv('SIGNING_PASSWORD') ?: project.findProperty('ipodKeyPassword')
    def haveKey = keystorePath && signingPassword && file(keystorePath).exists()
    signingConfigs {
        release {
            if (haveKey) {
                storeFile file(keystorePath)
                storePassword signingPassword
                keyAlias 'ipod3g'
                keyPassword signingPassword
            }
        }
    }

    buildTypes {
        release {
            // R8 drops unused code from the app and its libraries, mostly the Cast SDK.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig haveKey ? signingConfigs.release : signingConfigs.debug
        }
        debug {
            if (haveKey) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

kotlin {
    compilerOptions {
        // Same bytecode level as the Java code (compileOptions above).
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    // Spotify's App Remote SDK (Apache-2.0), from github.com/spotify/android-sdk/releases:
    // wakes and controls the Spotify app in the background. It reads Spotify's replies with Gson.
    implementation files('libs/spotify-app-remote-release-0.8.0.aar')
    implementation 'com.google.code.gson:gson:2.10.1'
    // Google Cast: finds Chromecasts and plays the phone's own music on them.
    implementation 'com.google.android.gms:play-services-cast-framework:22.3.1'
    // Coroutines for the Kotlin code: background work written as straight code, not callbacks.
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
}
