name: Build APK

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # The build number is GitHub's run number plus 9: early test builds on the phone ran 9
      # ahead, and Android won't install a lower version over a higher one.
      - name: Set build number
        run: echo "BUILD_NUMBER=$(( ${{ github.run_number }} + 9 ))" >> "$GITHUB_ENV"

      - name: Build signed release APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk iPod3G-v1.0.${{ env.BUILD_NUMBER }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: iPod3G-apk
          path: iPod3G-*.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ env.BUILD_NUMBER }}
          name: iPod 3G v1.0.${{ env.BUILD_NUMBER }}
          target_commitish: ${{ github.sha }}
          files: iPod3G-*.apk
          body: |
            Download the APK below on your phone and open it to install
            (allow "Install unknown apps" for your browser when asked).
