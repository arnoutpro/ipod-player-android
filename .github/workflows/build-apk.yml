name: Build APK

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # The build number is GitHub's run number plus 19: test builds on the phone once ran ahead,
      # and the radio release jumped to 1.0.60. Android won't install a lower version over a higher one.
      - name: Set build number
        run: echo "BUILD_NUMBER=$(( ${{ github.run_number }} + 19 ))" >> "$GITHUB_ENV"

      # The release key lives in the repo's secrets, not in the repo.
      - name: Unpack the signing key
        env:
          KEYSTORE: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then echo "::error::The SIGNING_KEYSTORE_BASE64 secret is missing"; exit 1; fi
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk iPodPlayerAndroid-v1.0.${{ env.BUILD_NUMBER }}.apk

      # No separate build artifact: the release below already holds the APK.
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ env.BUILD_NUMBER }}
          name: iPod Player Android v1.0.${{ env.BUILD_NUMBER }}
          target_commitish: ${{ github.sha }}
          files: iPodPlayerAndroid-*.apk
          body: |
            Download the APK below on your phone and open it to install
            (allow "Install unknown apps" for your browser when asked).
